name: Déploiement Firebase Hosting

# Se déclenche à la main, ou à chaque poussée sur main une fois les secrets en place.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Sans projet configuré, on saute le déploiement plutôt que d'échouer.
    if: vars.FIREBASE_PROJECT_ID != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Vide tant que la passerelle n'est pas déployée : l'app utilise
          # alors uniquement les sources sans clé.
          VITE_AI_GATEWAY_URL: ${{ vars.VITE_AI_GATEWAY_URL }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live
